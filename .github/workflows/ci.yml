name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/scan-private.sh
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun test test/
  lint:
    # Biome lint (the formatter isn't enforced until the format-all commit) and knip for unused
    # files, dependencies and exports.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: ./.github/actions/setup-hutch
        with:
          prepare: true
      - run: ~/.hutch/bin/hutch pm exec -- biome ci --formatter-enabled=false --reporter=github .
      - run: ~/.hutch/bin/hutch pm exec -- knip
  e2e:
    # Frame budgets in headless Chrome (preinstalled on the runner) against the bundled scene.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: ./.github/actions/setup-hutch
        with:
          prepare: true
      - run: ~/.hutch/bin/hutch pm exec -- tsc --noEmit
      - run: ~/.hutch/bin/hutch pm exec -- vite build
      - run: bun test e2e/
