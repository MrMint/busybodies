name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/scan-private.sh
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun test test/
  e2e:
    # Frame budgets in headless Chrome (preinstalled on the runner) against the bundled scene.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # The installer's host has had outages; keep Hutch and its toolchains between runs.
      - name: Cache Hutch
        id: hutch-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.hutch
          key: hutch-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hutch.lock') }}
          restore-keys: hutch-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Hutch, the devkit and locked dependencies
        run: |
          # The host flaps between 200 and 500: retry the whole install for up to ~10 minutes.
          for i in $(seq 1 30); do
            [ -x ~/.hutch/bin/hutch ] && break
            curl -fsSL https://artifacts.electrobun.dev/hutch/install.sh | sh && break
            rm -rf ~/.hutch; echo "installer attempt $i failed; retrying"; sleep 20
          done
          ~/.hutch/bin/hutch install --frozen-lockfile
          ~/.hutch/bin/hutch electrobun prepare
      # Save straight away, so a cold cache is filled even if a later step fails.
      - name: Save Hutch
        if: steps.hutch-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.hutch
          key: hutch-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hutch.lock') }}
      - run: ~/.hutch/bin/hutch pm exec -- tsc --noEmit
      - run: ~/.hutch/bin/hutch pm exec -- vite build
      - run: bun test e2e/
