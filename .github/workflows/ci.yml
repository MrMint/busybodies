name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/scan-private.sh
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun test test/
  e2e:
    # Frame budgets in headless Chrome (preinstalled on the runner) against the bundled scene.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install Hutch, the devkit and locked dependencies
        run: |
          curl -fsSL https://artifacts.electrobun.dev/hutch/install.sh | sh
          ~/.hutch/bin/hutch install --frozen-lockfile
          ~/.hutch/bin/hutch electrobun prepare
      - run: ~/.hutch/bin/hutch pm exec -- tsc --noEmit
      - run: ~/.hutch/bin/hutch pm exec -- vite build
      - run: bun test e2e/
